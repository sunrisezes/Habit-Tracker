name: Build & Publish Android APK Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Aura APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Debug Keystore if Missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Aura-Habit-Tracker.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Habit-Tracker-APK
          path: Aura-Habit-Tracker.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Aura v1.0.0 — Mindful Habit, Ritual & Focus Studio"
          body: |
            ## Aura — Mindful Habit, Ritual & Focus Studio (Android APK)

            Download and install **`Aura-Habit-Tracker.apk`** below on any Android device (Android 7.0 / API 24+).

            ### Included Features
            - **Intentional Daily Dashboard**: Kinetic completion rings, streak metrics, and swipeable ritual cards.
            - **Integrated Time Studio**: Countdown Focus Timer, Centisecond Stopwatch with laps, and Daily Alarm & Reminder Studio.
            - **12-Week Consistency Heatmap & Monthly Ring Calendar**: Visual streak matrix and retroactive day auditing.
            - **Deep Analytics & Guided Reflection Journal**: Smooth Bezier trend charts, milestone badges, and mood/energy journaling.
            - **100% Local-First Privacy**: Room SQLite storage with portable JSON backup and restore.
          files: Aura-Habit-Tracker.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
